[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "configdoctor"
description = "Safe, read-only diagnostics for local Python development environments."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dynamic = ["version"]

[project.scripts]
configdoctor = "configdoctor.cli:main"

[tool.setuptools]
packages = ["configdoctor"]

[tool.setuptools.dynamic]
version = { attr = "configdoctor.__version__" }
